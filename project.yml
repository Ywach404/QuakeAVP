name: QuakeAVP

options:
  bundleIdPrefix: com.acervantez.quakeavp
  deploymentTarget:
    visionOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: 5XS37VKG4C

targets:

  # --------------------------------------------------------------------
  # QuakeCore -- QuakeSpasm's engine core as a plain C static library.
  # No Apple frameworks, no Swift, no renderer. See Sources/QuakeCore/.
  # --------------------------------------------------------------------
  QuakeCore:
    type: library.static
    platform: visionOS
    deploymentTarget: "26.0"
    sources:
      - path: Sources/QuakeCore/engine
        excludes:
          # #included directly by image.c, exactly as upstream does. Building
          # it as its own TU duplicates every lodepng symbol at link time.
          - "lodepng.c"
          # #included by progdefs.h. Not a compilable unit and not a resource.
          - "progdefs.q1"
          - ".upstream-rev"
      - path: Sources/QuakeCore/platform
        excludes:
          # Compiled below with its own flag; see there.
          - "stb_vorbis.c"
      # Vendored verbatim (UPSTREAM.md), so its one tautological pointer
      # guard can't be fixed without diverging from upstream. Scoped to this
      # file rather than the target: everything else in platform/ is new code
      # and compiles clean. Mirrored by extra_cflags() in tools/check-core.sh.
      # -Wcomma is Xcode's addition and fires five times; -Wno-tautological-
      # compare is for the host check's clang, kept here so the two lists
      # read the same.
      - path: Sources/QuakeCore/platform/stb_vorbis.c
        compilerFlags: "-Wno-tautological-compare -Wno-comma"
      - path: Sources/QuakeCore/include
      # The renderer's engine-side half. Pure C (no Metal) so `make check`
      # still proves the whole library on any host; it lives under
      # QuakeRenderer because it is renderer logic, not platform shim.
      - path: Sources/QuakeRenderer/bridge
    settings:
      base:
        PRODUCT_NAME: QuakeCore
        # QAVP_PLATFORM switches quakedef.h and miniz.h off SDL/OpenGL and
        # onto the shims in Sources/QuakeCore/platform. Nothing else reads it.
        # USE_CODEC_* is what snd_codec.c's S_CodecInit tests before
        # registering a codec; with neither defined the whole BGM chain
        # compiles and does nothing. WAVE is the vendored snd_wave.c, VORBIS
        # is platform/snd_vorbis_avp.c on stb_vorbis. Keep the pair in sync
        # with tools/check-core.sh and tools/check-unit.sh.
        GCC_PREPROCESSOR_DEFINITIONS: "$(inherited) QAVP_PLATFORM=1 USE_CODEC_WAVE=1 USE_CODEC_VORBIS=1"
        GCC_C_LANGUAGE_STANDARD: gnu99
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/Sources/QuakeCore/engine"
          - "$(SRCROOT)/Sources/QuakeCore/platform"
          - "$(SRCROOT)/Sources/QuakeCore/include"
          - "$(SRCROOT)/Sources/QuakeRenderer/bridge"
        # 1996 C. These warnings fire in the thousands and none of them are
        # actionable without rewriting id's code, which defeats the point of
        # vendoring a known-good engine. New code lives in platform/ and is
        # held to the default warning level by review, not by the compiler.
        GCC_WARN_UNUSED_VARIABLE: NO
        GCC_WARN_UNUSED_FUNCTION: NO
        GCC_WARN_64_TO_32_BIT_CONVERSION: NO
        CLANG_WARN_STRICT_PROTOTYPES: NO
        CLANG_WARN_IMPLICIT_FALLTHROUGH: NO
        WARNING_CFLAGS: "-Wno-unused-but-set-variable -Wno-sign-compare -Wno-missing-braces"
        CLANG_ENABLE_MODULES: NO
        DEFINES_MODULE: NO
        SKIP_INSTALL: YES

  # --------------------------------------------------------------------
  # QuakeAVP -- the visionOS app. SwiftUI shell around QuakeCore.
  # --------------------------------------------------------------------
  QuakeAVP:
    type: application
    platform: visionOS
    deploymentTarget: "26.0"
    sources:
      - path: App/Sources
      - path: App/Resources
      # DEV ONLY -- strip before release. The author's own game paks, bundled
      # so a dev build runs without a manual Files copy; QuakeEngineHost seeds
      # them into Documents/id1 on launch only when missing. The .pak files are
      # gitignored (never committed). To strip: delete this source entry, the
      # App/DevGameData folder, and seedBundledGameData() in QuakeEngineHost.
      - path: App/DevGameData
        excludes:
          - ".gitkeep"
          # Added below as a folder reference instead; see there.
          - "music"
          - "music/**"
      # DEV ONLY -- strip with the rest of DevGameData. The CD soundtrack
      # rips, same status as the paks: the author's own, gitignored, never
      # committed. A folder REFERENCE rather than a recursed group because
      # the resources phase flattens groups into the bundle root, and the
      # engine wants `music/trackNN.ogg` -- a directory, not ten loose files
      # whose names a mission pack's own track02 would collide with.
      #
      # THE .gitkeep IN HERE IS LOAD-BEARING. A folder reference to a path
      # that does not exist is a hard build failure ("The file music couldn't
      # be opened"), not a quietly skipped resource, so the directory has to
      # exist in a fresh clone even though every file in it is gitignored --
      # hence .gitignore ignoring the CONTENTS and keeping the folder, exactly
      # the way App/DevGameData itself is kept. `optional` below only
      # suppresses xcodegen's generate-time existence check; the reference is
      # still emitted and CpResource still fails. Measured, with `optional`
      # already set: xcodebuild exits 65. Do not delete the .gitkeep.
      #
      # Cost, for whoever is deciding about the release strip: this folder is
      # ~79 MB, which is most of the dev .app's ~140 MB.
      - path: App/DevGameData/music
        type: folder
        optional: true
      # Swift + Metal consumer half of the renderer. Compiled into the app
      # (not QuakeCore, which stays a plain C library); the bridge/ C half
      # is excluded here because QuakeCore compiles it.
      - path: Sources/QuakeRenderer
        excludes:
          - "bridge/**"
    dependencies:
      - target: QuakeCore
    # Explicit Info.plist (XcodeGen generates it): the immersive space is a
    # second scene, which requires UIApplicationSupportsMultipleScenes --
    # the INFOPLIST_KEY_* generation path has no switch for that.
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Quake
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UIApplicationPreferredDefaultSceneSessionRole: UIWindowSceneSessionRoleApplication
        UIApplicationSupportsIndirectInputEvents: true
        # M5 input: hands-only play needs hand tracking; PSVR2 Sense
        # controllers arrive as spatial accessories (ARKit accessory
        # tracking + the SpatialGamepad controller profile).
        NSHandsTrackingUsageDescription: Hand tracking drives movement and firing when no controller is connected.
        NSAccessoryTrackingUsageDescription: Tracks PlayStation VR2 Sense controllers for aiming and movement.
        GCSupportedGameControllers:
          - ProfileName: SpatialGamepad
          - ProfileName: ExtendedGamepad
        # Game data is not redistributable, so the user supplies pak0.pak by
        # dropping it into the app's Documents folder over the Files app.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.acervantez.quakeavp.app
        PRODUCT_NAME: Quake
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "0.1"
        TARGETED_DEVICE_FAMILY: "7"
        ENABLE_PREVIEWS: YES
        # The world draws twice -- depth prepass, then a colour pass with
        # depthCompare == .equal. The shared vertex output is [[position,
        # invariant]], but that attribute is a NO-OP unless the Metal compiler
        # is told to preserve invariance; without this the two pipelines drift
        # by a ULP and .equal sparkles to passthrough, worst in the near field.
        MTL_PRESERVE_INVARIANCE: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_OBJC_BRIDGING_HEADER: "$(SRCROOT)/App/Sources/QuakeAVP-Bridging-Header.h"
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/Sources/QuakeCore/include"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGN_IDENTITY: "Apple Development"

  # --------------------------------------------------------------------
  # Unit tests for the pure-Swift pieces (sidecar track math, export
  # presets, capture state). Hosted by the app so @testable import works.
  # --------------------------------------------------------------------
  QuakeAVPTests:
    type: bundle.unit-test
    platform: visionOS
    deploymentTarget: "26.0"
    sources:
      - path: Tests/QuakeAVPTests
    dependencies:
      - target: QuakeAVP
    settings:
      base:
        # The app's product is Quake.app, not QuakeAVP.app.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Quake.app/Quake"
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  QuakeAVP:
    build:
      targets:
        QuakeAVP: all
    run:
      config: Debug
      # Launch WITHOUT lldb attached. The debugger ptraces the process and
      # disrupts the audio and compositor XPC (AURemoteIO -50, immersive hang) --
      # see docs/working-notes.md. xcodegen defaults this to true, which re-checked "Debug
      # executable" on every `xcodegen generate` and undid the manual uncheck.
      debugEnabled: false
    test:
      config: Debug
      targets:
        - QuakeAVPTests
